services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matcha
      POSTGRES_PASSWORD: matcha
      POSTGRES_DB: matcha
    ports:
      - "5544:5432"
    volumes:
      - matcha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcha -d matcha"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://matcha:matcha@postgres:5432/matcha
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/srv
      - matcha_uploads:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python migrate.py && gunicorn -w 4 -b 0.0.0.0:8000 wsgi:app --reload"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/ui/node_modules
      - /workspace/packages/api-client/node_modules
    depends_on:
      - api

volumes:
  matcha_pg_data:
  matcha_uploads:
